---

system_packages_repo_list:
  - name: epel-local
    description: "[Local] Extra Packages for Enterprise Linux $releasever - $basearch"
    baseurl: "{{ local_registry }}/epel/$releasever/Everything/$basearch/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts.distribution_major_version }}"
    priority: 10
    timeout: 1
    skip_if_unavailable: true
  - name: "rocm-{{ repo_setup_rocm_version }}-local"
    description: "[Local] ROCm {{ repo_setup_rocm_version }} repository"
    baseurl: "{{ local_registry }}/rocm/el$releasever/{{ repo_setup_rocm_version }}/main/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://repo.radeon.com/rocm/rocm.gpg.key"
    # Note epel also contains some rocm packages, setting higher prio to prevent ambiguity
    priority: 9
    timeout: 1
    skip_if_unavailable: true
  - name: "vscode-local"
    description: "[Local] Visual Studio Code"
    baseurl: "{{ local_registry }}/vscode-yum/"
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    priority: 10
    timeout: 3
    skip_if_unavailable: true
  - name: "rpmfusion-free-updates-local"
    description: "[Local] RPM Fusion for EL {{ ansible_facts.distribution_major_version }} - Free - Updates"
    baseurl: "{{ local_registry }}/rpmfusion-el/free/el/updates/$releasever/$basearch/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://download1.rpmfusion.org/free/el/RPM-GPG-KEY-rpmfusion-free-el-{{ ansible_facts.distribution_major_version }}"
    priority: 10
    timeout: 1
    skip_if_unavailable: true
  - name: rpmfusion-nonfree-updates-local
    description: "[Local] RPM Fusion for EL {{ ansible_facts.distribution_major_version }} - Nonfree - Updates"
    baseurl: "{{ local_registry }}/rpmfusion-el/nonfree/el/updates/$releasever/$basearch/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://download1.rpmfusion.org/nonfree/el/RPM-GPG-KEY-rpmfusion-nonfree-el-{{ ansible_facts.distribution_major_version }}"
    priority: 10
    timeout: 1
    skip_if_unavailable: true

...
